version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_intelligence_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Multi-Document RAG Intelligence Assistant
      - API_V1_STR=/api
      - SECRET_KEY=super-secret-rag-jwt-key-production-change-this-938210
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - USE_MONGODB=true
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=rag_intelligence_db
      - MAX_UPLOAD_SIZE_MB=50
      - DEFAULT_CHUNK_SIZE=800
      - DEFAULT_CHUNK_OVERLAP=150
      - DEFAULT_TOP_K=5
      - DEFAULT_SIMILARITY_THRESHOLD=0.35
      - DEFAULT_HYBRID_ALPHA=0.65
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_intelligence_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rag_network

  mongodb:
    image: mongo:7.0
    container_name: rag_intelligence_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  mongo_data:

